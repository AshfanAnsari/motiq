<!DOCTYPE html>
<html lang="en" data-theme="midnight" data-type="grotesk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MOTIQ — prompt-to-motion playground</title>
<style>
  @font-face{
    font-family:'Archivo';
    src:url('fonts/Archivo-Variable.ttf') format('truetype');
    font-weight:100 900;
    font-stretch:50% 125%;
    font-display:swap;
  }
  @font-face{
    font-family:'Archivo Black';
    src:url('fonts/ArchivoBlack-Regular.ttf') format('truetype');
    font-weight:400;
    font-display:swap;
  }
  @font-face{
    font-family:'Playfair Display';
    src:url('fonts/PlayfairDisplay-Variable.ttf') format('truetype');
    font-weight:400 900;
    font-display:swap;
  }
  @font-face{
    font-family:'JetBrains Mono';
    src:url('fonts/JetBrainsMono-Variable.ttf') format('truetype');
    font-weight:100 800;
    font-display:swap;
  }

  /* ---------- themes ---------- */
  :root, html[data-theme='midnight']{
    --bg:#101013; --ink:#f2efe9; --mute:#8b877f;
    --line:rgba(242,239,233,.14); --line-strong:rgba(242,239,233,.45);
    --glow:#5c130c; --bar:rgba(255,255,255,.055);
    --accent:#e0492e; --btn-ink:#101013; --pool:rgba(224,73,46,.5); --rec:#ff453a;
    --tile-hover:rgba(255,255,255,.05);
  }
  html[data-theme='bone']{
    --bg:#e9e4da; --ink:#16130d; --mute:#7d7462;
    --line:rgba(22,19,13,.16); --line-strong:rgba(22,19,13,.42);
    --glow:#d8c096; --bar:rgba(22,19,13,.05);
    --accent:#b3351f; --btn-ink:#efe9dc; --pool:rgba(179,53,31,.42); --rec:#cf2413;
    --tile-hover:rgba(22,19,13,.05);
  }
  html[data-theme='forest']{
    --bg:#0a120d; --ink:#ece7d8; --mute:#7e8b7c;
    --line:rgba(236,231,216,.14); --line-strong:rgba(236,231,216,.42);
    --glow:#14401f; --bar:rgba(255,255,255,.05);
    --accent:#8fce6e; --btn-ink:#0a120d; --pool:rgba(143,206,110,.4); --rec:#ff5147;
    --tile-hover:rgba(255,255,255,.05);
  }
  html[data-theme='cobalt']{
    --bg:#0a1226; --ink:#f4f6fb; --mute:#8494b3;
    --line:rgba(244,246,251,.15); --line-strong:rgba(244,246,251,.45);
    --glow:#173a75; --bar:rgba(255,255,255,.06);
    --accent:#6ea8ff; --btn-ink:#0a1226; --pool:rgba(110,168,255,.45); --rec:#ff5147;
    --tile-hover:rgba(255,255,255,.05);
  }

  /* ---------- type styles ---------- */
  html[data-type='grotesk']{
    --word-font:'Archivo Black','Archivo',sans-serif;
    --word-weight:400; --wsize:20cqw; --wmin:58px; --wls:.015em;
  }
  html[data-type='serif']{
    --word-font:'Playfair Display',Georgia,serif;
    --word-weight:800; --wsize:19cqw; --wmin:54px; --wls:.005em;
  }
  html[data-type='mono']{
    --word-font:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
    --word-weight:700; --wsize:16cqw; --wmin:38px; --wls:0em;
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--ink);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  /* ---------- top bar ---------- */
  header{
    position:relative;z-index:5;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:20px 28px;
  }
  .logo{
    font-weight:800;font-stretch:118%;
    font-size:19px;letter-spacing:.34em;text-transform:uppercase;
  }
  .logo span{color:var(--accent)}
  .tagline{
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);
    font-weight:500;
  }
  .tagline{margin-left:auto}
  @media (max-width:680px){ .tagline{display:none} header{padding:16px 20px;gap:12px} }

  /* ---------- layout: side panels + centre ---------- */
  .layout{display:flex;flex:1;min-height:0}
  .centre{display:flex;flex-direction:column;flex:1;min-width:0}
  .panel{
    flex:0 0 auto;display:flex;flex-direction:column;min-height:0;
    background:var(--bar);backdrop-filter:blur(10px);
  }
  .panel-left{width:248px;border-right:1px solid var(--line)}
  .panel-right{width:216px;border-left:1px solid var(--line)}
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 16px 8px;
  }
  .panel-head h3{
    font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;
  }
  .panel-head .fx-count{color:var(--accent)}
  .panel-collapse{
    width:24px;height:24px;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    background:transparent;border:1px solid var(--line);
    color:var(--mute);font-size:15px;line-height:1;cursor:pointer;font-family:inherit;
    transition:color .15s, border-color .15s;
  }
  .panel-collapse:hover{color:var(--ink);border-color:var(--line-strong)}
  .panel-body{flex:1;overflow-y:auto;padding:2px 12px 16px;scrollbar-width:thin}

  /* ui option rows (right panel) */
  .opt-group{margin-bottom:20px}
  .opt-group h4{
    font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--mute);font-weight:700;margin:2px 2px 8px;
  }
  .theme-row,.type-row,.stage-btn{
    display:flex;align-items:center;gap:10px;width:100%;
    text-align:left;color:var(--ink);font-family:inherit;
    font-size:13px;font-weight:600;letter-spacing:.02em;
    background:transparent;border:1px solid var(--line);border-radius:10px;
    padding:9px 11px;margin-bottom:6px;cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .theme-row:hover,.type-row:hover,.stage-btn:hover{border-color:var(--line-strong);background:var(--tile-hover)}
  .theme-row.active,.type-row.active{border-color:var(--accent);background:var(--tile-hover)}
  .t-dot{
    width:15px;height:15px;border-radius:50%;flex:0 0 auto;
    background:var(--dot);border:1px solid var(--line-strong);
  }
  .stage-btn{justify-content:center;font-size:12.5px}

  /* desktop collapse edge tabs */
  .edge-tab{
    position:fixed;top:50%;transform:translateY(-50%);z-index:30;
    display:none;width:22px;height:64px;
    align-items:center;justify-content:center;
    background:var(--bar);border:1px solid var(--line);
    color:var(--mute);font-size:15px;cursor:pointer;font-family:inherit;
  }
  #lpTab{left:0;border-left:none;border-radius:0 10px 10px 0}
  #rpTab{right:0;border-right:none;border-radius:10px 0 0 10px}
  .edge-tab:hover{color:var(--ink)}
  @media (min-width:821px){
    body.lp-closed .panel-left{display:none}
    body.rp-closed .panel-right{display:none}
    body.lp-closed #lpTab{display:flex}
    body.rp-closed #rpTab{display:flex}
  }

  /* drawer buttons + backdrop (phone) */
  .drawer-row{display:none}
  .backdrop{display:none}
  @media (max-width:820px){
    .panel{
      position:fixed;top:0;bottom:0;z-index:60;
      width:min(84vw,300px);background:var(--bg);
      transition:transform .32s ease;
    }
    .panel-left{left:0;transform:translateX(-105%)}
    .panel-right{right:0;transform:translateX(105%)}
    body.drawer-l .panel-left{transform:none}
    body.drawer-r .panel-right{transform:none}
    .backdrop{
      display:block;position:fixed;inset:0;z-index:55;
      background:rgba(0,0,0,.5);
      opacity:0;pointer-events:none;transition:opacity .3s;
    }
    body.drawer-l .backdrop, body.drawer-r .backdrop{opacity:1;pointer-events:auto}
    .drawer-row{
      display:flex;justify-content:space-between;gap:10px;
      width:min(100%,760px);
    }
    .drawer-btn{
      display:flex;align-items:center;gap:8px;
      font-family:inherit;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
      color:var(--ink);background:transparent;
      border:1px solid var(--line);border-radius:999px;
      padding:8px 16px;cursor:pointer;
    }
    .drawer-btn:active{transform:scale(.96)}
    .drawer-btn svg{width:14px;height:14px;display:block}
  }

  /* ---------- stage ---------- */
  main{
    position:relative;flex:1;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    container-type:inline-size;
  }
  .glow{
    position:absolute;left:50%;top:52%;
    width:min(88vw,880px);height:min(58vh,480px);
    transform:translate(-50%,-50%);
    background:radial-gradient(ellipse at center, var(--glow) 0%, transparent 68%);
    opacity:.55;pointer-events:none;
  }
  .stage-word{position:relative;z-index:2;text-align:center;padding:0 16px}
  .word{
    font-family:var(--word-font);
    font-weight:var(--word-weight);
    font-size:clamp(var(--wmin),var(--wsize),176px);
    line-height:1.02;
    letter-spacing:var(--wls);
    text-transform:uppercase;
    white-space:nowrap;
    cursor:text;
    user-select:none;
  }
  .word .ch{display:inline-block;will-change:transform,opacity}
  .word .sp{display:inline-block;width:.34em}
  .word .caret{
    display:inline-block;width:.5em;height:.8em;
    background:var(--accent);
    margin-left:.07em;vertical-align:-.06em;
  }
  .pool{
    position:absolute;left:50%;bottom:-4.2vh;
    width:56%;height:20px;border-radius:50%;
    background:radial-gradient(ellipse at center, var(--pool) 0%, transparent 70%);
    transform:translateX(-50%) scaleX(.2);
    opacity:0;pointer-events:none;filter:blur(2px);
  }
  .edit-hint{
    margin-top:22px;
    font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);
    font-weight:500;
  }
  #wordInput{
    display:none;
    font-family:var(--word-font);
    font-weight:var(--word-weight);
    font-size:clamp(var(--wmin),var(--wsize),176px);
    line-height:1.02;letter-spacing:var(--wls);text-transform:uppercase;
    background:transparent;border:none;outline:none;color:var(--ink);
    text-align:center;width:min(92vw,880px);
    border-bottom:2px solid var(--line-strong);
  }

  /* ---------- controls ---------- */
  .controls{
    position:relative;z-index:5;
    display:flex;flex-direction:column;align-items:center;
    padding:0 20px calc(26px + env(safe-area-inset-bottom));
    gap:12px;
  }
  #feedback{
    min-height:18px;
    font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--mute);font-weight:600;text-align:center;
  }
  #feedback b{color:var(--ink);font-weight:700}

  /* effects groups + tiles (left panel) */
  .fx-group h4{
    font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--mute);font-weight:700;
    margin:10px 2px 8px;
  }
  .fx-group:first-child h4{margin-top:2px}
  .fx-grid{
    display:grid;grid-template-columns:1fr;
    gap:6px;margin-bottom:12px;
  }
  .fx-tile{
    display:flex;align-items:baseline;gap:8px;
    text-align:left;
    background:transparent;
    border:1px solid var(--line);border-radius:10px;
    padding:8px 10px;cursor:pointer;
    color:var(--ink);font-family:inherit;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .fx-tile:hover{border-color:var(--line-strong);background:var(--tile-hover)}
  .fx-tile:active{transform:scale(.97)}
  .fx-tile b{font-size:12.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
  .fx-tile span{
    margin-left:auto;text-align:right;
    font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);
  }

  .chips{
    display:flex;gap:8px;max-width:100%;
    overflow-x:auto;padding:2px 2px 4px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;
    font-family:inherit;font-size:12.5px;font-weight:600;letter-spacing:.06em;
    color:var(--ink);background:transparent;
    border:1px solid var(--line);border-radius:999px;
    padding:8px 15px;cursor:pointer;
    transition:border-color .18s, background .18s;
  }
  .chip:hover{border-color:var(--line-strong);background:var(--tile-hover)}
  .chip:active{transform:scale(.96)}
  .bar-row{
    display:flex;align-items:stretch;gap:10px;
    width:min(100%,760px);
    justify-content:center;
  }
  .promptbar{
    flex:1 1 auto;min-width:0;max-width:620px;
    display:flex;align-items:center;gap:10px;
    background:var(--bar);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 7px 7px 24px;
    backdrop-filter:blur(10px);
  }
  .promptbar:focus-within{border-color:var(--line-strong)}
  #promptInput{
    flex:1;min-width:0;
    background:transparent;border:none;outline:none;
    color:var(--ink);font-family:inherit;
    font-size:16px;font-weight:500;letter-spacing:.02em;
  }
  #promptInput::placeholder{color:var(--mute)}
  #sendBtn{
    flex:0 0 auto;
    width:42px;height:42px;border-radius:50%;
    border:none;cursor:pointer;
    background:var(--ink);color:var(--btn-ink);
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s, opacity .15s;
  }
  #sendBtn:hover{opacity:.86;transform:translateY(-1px)}
  #sendBtn:active{transform:scale(.93)}
  #sendBtn svg{width:18px;height:18px;display:block}

  /* ---------- record / export ---------- */
  .rec-btn{
    flex:0 0 auto;
    display:flex;align-items:center;gap:8px;
    font-family:inherit;font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink);background:var(--bar);
    border:1px solid var(--line);border-radius:999px;
    padding:0 18px;cursor:pointer;
    transition:border-color .18s, background .18s;
  }
  .rec-btn:hover{border-color:var(--line-strong)}
  .rec-btn:active{transform:scale(.96)}
  .rec-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--rec);flex:0 0 auto;
  }
  .rec-btn.recording{border-color:var(--rec)}
  .rec-btn.recording .rec-dot{animation:recPulse 1.1s ease-in-out infinite}
  .rec-time{font-variant-numeric:tabular-nums;letter-spacing:.04em}
  @keyframes recPulse{ 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.72)} }
  @media (prefers-reduced-motion: reduce){ .rec-btn.recording .rec-dot{animation:none} }
  @media (max-width:560px){ .rec-btn{padding:0 13px;font-size:11px} }
</style>
</head>
<body>

<header>
  <div class="logo">MOT<span>I</span>Q</div>
  <div class="tagline">prompt-driven motion — no keyframes</div>
</header>

<div class="layout">
  <aside class="panel panel-left" id="panelLeft" aria-label="Effects library">
    <div class="panel-head">
      <h3>Effects <span class="fx-count" id="fxCount"></span></h3>
      <button type="button" class="panel-collapse" id="lpCollapse" aria-label="Hide effects panel">‹</button>
    </div>
    <div class="panel-body" id="fxPanel"></div>
  </aside>

  <div class="centre">
<main id="stage">
  <div class="glow" id="glow"></div>
  <div class="stage-word" id="stageWord">
    <div id="floatWrap">
      <div id="persist">
        <div class="word" id="word" title="Click to edit the word"></div>
      </div>
    </div>
    <input id="wordInput" maxlength="14" autocomplete="off" spellcheck="false" aria-label="Your words">
    <div class="pool" id="pool"></div>
    <div class="edit-hint" id="editHint">click the word to make it yours</div>
  </div>
</main>

<div class="controls">
  <div id="feedback">type a command — or tap one below</div>
  <div class="drawer-row">
    <button type="button" class="drawer-btn" id="drawerFx">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
      Effects
    </button>
    <button type="button" class="drawer-btn" id="drawerStyle">Style</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="bar-row">
    <form class="promptbar" id="promptForm" autocomplete="off">
      <input id="promptInput" type="text" placeholder="make this word bounce…" aria-label="Motion command" autocomplete="off" spellcheck="false">
      <button id="sendBtn" type="submit" aria-label="Run command">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5"/><path d="M5 11l7-7 7 7"/></svg>
      </button>
    </form>
    <button type="button" class="rec-btn" id="recBtn" aria-pressed="false">
      <span class="rec-dot"></span><span class="rec-label">Record</span><span class="rec-time" id="recTime" hidden>0:00</span>
    </button>
  </div>
</div>
  </div><!-- /centre -->

  <aside class="panel panel-right" id="panelRight" aria-label="Interface options">
    <div class="panel-head">
      <h3>UI Options</h3>
      <button type="button" class="panel-collapse" id="rpCollapse" aria-label="Hide options panel">›</button>
    </div>
    <div class="panel-body">
      <div class="opt-group" id="themeSw" role="group" aria-label="Theme">
        <h4>Theme</h4>
        <button type="button" class="theme-row active" data-theme="midnight"><span class="t-dot" style="--dot:#101013"></span>Midnight</button>
        <button type="button" class="theme-row" data-theme="bone"><span class="t-dot" style="--dot:#e9e4da"></span>Bone</button>
        <button type="button" class="theme-row" data-theme="forest"><span class="t-dot" style="--dot:#0d2013"></span>Forest</button>
        <button type="button" class="theme-row" data-theme="cobalt"><span class="t-dot" style="--dot:#0d1a3a"></span>Cobalt</button>
      </div>
      <div class="opt-group" id="typeSw" role="group" aria-label="Type style">
        <h4>Type</h4>
        <button type="button" class="type-row active" data-type="grotesk" style="font-family:'Archivo Black','Archivo',sans-serif">Grotesk</button>
        <button type="button" class="type-row" data-type="serif" style="font-family:'Playfair Display',Georgia,serif;font-weight:800">Serif</button>
        <button type="button" class="type-row" data-type="mono" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700">Mono</button>
      </div>
      <div class="opt-group">
        <h4>Stage</h4>
        <button type="button" class="stage-btn" id="stageColor">Splash of color</button>
        <button type="button" class="stage-btn" id="stageReset">Reset stage</button>
      </div>
    </div>
  </aside>
</div><!-- /layout -->

<button type="button" class="edge-tab" id="lpTab" aria-label="Show effects panel">›</button>
<button type="button" class="edge-tab" id="rpTab" aria-label="Show options panel">‹</button>
<div class="backdrop" id="backdrop"></div>

<script src="vendor/gsap.min.js"></script>
<script>
(function(){
  "use strict";
  var wordEl   = document.getElementById('word');
  var persist  = document.getElementById('persist');
  var floatW   = document.getElementById('floatWrap');
  var pool     = document.getElementById('pool');
  var glow     = document.getElementById('glow');
  var feedback = document.getElementById('feedback');
  var form     = document.getElementById('promptForm');
  var input    = document.getElementById('promptInput');
  var wordIn   = document.getElementById('wordInput');
  var editHint = document.getElementById('editHint');
  var fxPanel  = document.getElementById('fxPanel');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------------- themes (JS mirror of the CSS variables) ---------------- */
  var THEMES = {
    midnight: { bg:'#101013', glow:'#5c130c', ink:'#f2efe9', neon:'#ff7a5c', label:'Midnight' },
    bone:     { bg:'#e9e4da', glow:'#d8c096', ink:'#16130d', neon:'#d63c1e', label:'Bone' },
    forest:   { bg:'#0a120d', glow:'#14401f', ink:'#ece7d8', neon:'#b5ec8d', label:'Forest' },
    cobalt:   { bg:'#0a1226', glow:'#173a75', ink:'#f4f6fb', neon:'#9cc2ff', label:'Cobalt' }
  };
  var TYPES = { grotesk:'Grotesk', serif:'Serif', mono:'Mono' };

  /* ---------------- state ---------------- */
  var state = { italic:false, scale:1, speed:1, colorIdx:-1,
                theme:'midnight', type:'grotesk', neon:false, rainbow:false };
  var PALETTE = [
    { bg:'#4a0f0a', glow:'#8c1d12', name:'crimson' },
    { bg:'#0a2e21', glow:'#0d4d33', name:'forest'  },
    { bg:'#0d2440', glow:'#14467c', name:'cobalt'  },
    { bg:'#33230a', glow:'#7a5200', name:'ochre'   },
    { bg:'#082a30', glow:'#0b5563', name:'teal'    }
  ];
  var RAINBOW = ['#ff5252','#ff9f43','#f5cf4d','#57c96b','#4d9fff','#9b6bff'];
  var currentText = 'MOTION';
  var scrambleTween = null;

  function theme(){ return THEMES[state.theme]; }
  function glowGradient(col){
    return 'radial-gradient(ellipse at center, ' + col + ' 0%, transparent 68%)';
  }
  function letters(){ return wordEl.querySelectorAll('.ch'); }

  function buildWord(text){
    killActions();
    currentText = text;
    wordEl.innerHTML = '';
    text.split('').forEach(function(c){
      var s = document.createElement('span');
      if (c === ' '){ s.className = 'sp'; }
      else { s.className = 'ch'; s.textContent = c; }

  /* ---------------- ambient idle float ---------------- */
  var ambient = null;

    if (caret){ gsap.killTweensOf(caret); caret.remove(); }

  function resetLetters(dur){
    gsap.to(letters(), { x:0, y:0, rotation:0, rotationX:0, rotationY:0, scale:1, scaleX:1, scaleY:1,
      skewX:0, opacity:1, duration: dur || 0, ease:'power2.out', overwrite:true, stagger:0 });
    gsap.to(wordEl, { rotation:0, scale:1, filter:'blur(0px)',
      duration: (dur || 0) > 0 ? dur : .2, ease:'power2.out', overwrite:'auto' });
    gsap.to(pool, { opacity:0, scaleX:.2, duration:.3 });

  function neonShadow(acc, strong){

      : '0 0 4px ' + acc + ', 0 0 13px ' + acc;

  function paintNeon(pulse){
    var acc = theme().neon;
    state.neon = true; state.rainbow = false;
    gsap.to(letters(), { color: acc, textShadow: neonShadow(acc, true),
      duration:.35, stagger:.04, ease:'power2.out', overwrite:'auto' });
    gsap.to(letters(), { textShadow: neonShadow(acc, false),
      duration:.9, delay: pulse ? .45 : .4, ease:'power2.inOut', overwrite:false });
  }
  function paintRainbow(){
    state.rainbow = true; state.neon = false;
    Array.prototype.forEach.call(letters(), function(el, i){
      gsap.to(el, { color: RAINBOW[i % RAINBOW.length], textShadow:'0 0 0 rgba(0,0,0,0)',
        duration:.5, delay:i * .05, overwrite:'auto' });
    });
  }
  function clearLetterFx(){
    state.neon = false; state.rainbow = false;

      duration:.35, overwrite:'auto',
      onComplete:function(){ gsap.set(letters(), { clearProps:'color,textShadow' }); } });

    wave: function(){

        .to(letters(), { y:'-0.16em', duration:.24, ease:'sine.inOut', stagger:.06 }, '-=0.12')
        .to(letters(), { y:0, duration:.32, ease:'sine.inOut', stagger:.06 }, '-=0.06');

    shake: function(){

        .to(wordEl, { x:-13, duration:.05 }).to(wordEl, { x:11, duration:.06 })
        .to(wordEl, { x:-8, duration:.06 }).to(wordEl, { x:6, duration:.06 })
        .to(wordEl, { x:-3, duration:.05 }).to(wordEl, { x:0, duration:.06 });

    },

    /* ---------- new effects ---------- */
    drop: function(){
      prepLetters();
      var els = letters();
      gsap.set(els, { transformOrigin:'50% 100%' });
      var tl = gsap.timeline();
      tl.fromTo(els, { y:'-1.7em', opacity:0 }, { opacity:1, duration:.05, stagger:.055 }, 0)
        .to(els, { y:0, duration:.5, ease:'power2.in', stagger:.055 }, 0)
        .to(els, { scaleY:.8, scaleX:1.14, duration:.07, yoyo:true, repeat:1,
            ease:'power1.inOut', stagger:.055 }, .48)
        .to(els, { y:'-0.17em', duration:.15, ease:'power2.out', stagger:.055 }, .58)
        .to(els, { y:0, duration:.45, ease:'bounce.out', stagger:.055 }, .73);

    rise: function(){

    flip: function(){

      gsap.set(wordEl, { transformPerspective:800 });

    swing: function(){

        .to(wordEl, { rotation:13, duration:.5, ease:'sine.out' })
        .to(wordEl, { rotation:-9, duration:.65, ease:'sine.inOut' })
        .to(wordEl, { rotation:5.5, duration:.6, ease:'sine.inOut' })
        .to(wordEl, { rotation:-3, duration:.55, ease:'sine.inOut' })
        .to(wordEl, { rotation:0, duration:.5, ease:'sine.inOut' });

    zoom: function(){
      killActions();
      gsap.timeline()
        .to(wordEl, { scale:1.25, duration:.16, ease:'power3.out' })
        .to(wordEl, { scale:1, duration:.65, ease:'back.out(2.2)' });
      say('<b>punch.</b> straight at you, then back.');
    },
    stretch: function(){
      prepLetters();
      gsap.set(letters(), { transformOrigin:'50% 50%' });

        .to(letters(), { scaleX:1.65, scaleY:.8, duration:.3, ease:'power3.out',
            stagger:{ each:.03, from:'center' } })
        .to(letters(), { scaleX:1, scaleY:1, duration:1, ease:'elastic.out(1, 0.32)',

    },
    blur: function(){
      killActions();
      gsap.timeline()
        .to(wordEl, { filter:'blur(16px)', scale:1.045, duration:.45, ease:'power2.in' })
        .to(wordEl, { filter:'blur(0px)', scale:1, duration:.8, ease:'power2.out' }, '+=0.15');
      say('<b>out of focus…</b> and back into the light.');
    },
    glitch: function(){
      prepLetters();
      var steps = 8, stepT = .075;
      var tl = gsap.timeline();
      for (var i = 0; i < steps; i++){
        tl.to(letters(), {
            x:function(){ return gsap.utils.random(-7, 7); },
            skewX:function(){ return gsap.utils.random(-12, 12); },
            textShadow: (i % 2
              ? '4px 0 rgba(255,0,80,.85), -4px 0 rgba(0,255,255,.85)'
              : '-4px 0 rgba(255,0,80,.85), 4px 0 rgba(0,255,255,.85)'),
            duration:.055, ease:'steps(1)'
          }, i * stepT);
      }
      tl.to(wordEl, { x:-6, duration:.05, ease:'steps(1)' }, 3 * stepT)
        .to(wordEl, { x:5, duration:.05, ease:'steps(1)' }, 5 * stepT)
        .to(wordEl, { x:0, duration:.05 }, steps * stepT)
        .to(letters(), { x:0, skewX:0, duration:.06 }, steps * stepT)
        .to(letters(), { textShadow: state.neon ? neonShadow(theme().neon, false) : '0 0 0 rgba(0,0,0,0)',
            duration:.12, onComplete:function(){
              if (!state.neon) gsap.set(letters(), { clearProps:'textShadow' });
            } }, steps * stepT);
      say('<b>glitched.</b> signal lost, signal found.');
    },
    typewriter: function(){
      prepLetters();
      var els = letters();
      var caret = document.createElement('span');
      caret.className = 'caret';
      wordEl.appendChild(caret);
      var blink = gsap.to(caret, { opacity:0, duration:.34, repeat:-1, yoyo:true, ease:'steps(1)' });
      gsap.set(els, { opacity:0, y:'0.12em' });
      gsap.to(els, { opacity:1, y:0, duration:.22, ease:'back.out(2.2)', stagger:.1,
        onComplete:function(){
          blink.kill();
          gsap.to(caret, { opacity:0, duration:.3, delay:.5,
            onComplete:function(){ if (caret.parentNode) caret.remove(); } });
        } });
      say('<b>typed out.</b> one letter at a time.');
    },
    scramble: function(){
      prepLetters();
      var els = Array.prototype.slice.call(letters());
      var orig = els.map(function(el){ return el.textContent; });
      var GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&@$';
      var o = { p:0 };
      scrambleTween = gsap.to(o, { p:1, duration:1.05, ease:'power2.inOut',
        onUpdate:function(){
          var resolved = Math.floor(o.p * (els.length + 3));
          els.forEach(function(el, i){
            el.textContent = i < resolved ? orig[i]
              : GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
          });
        },
        onComplete:function(){
          els.forEach(function(el, i){ el.textContent = orig[i]; });
          scrambleTween = null;

    },
    neon: function(){
      killActions();
      paintNeon(true);
      say('<b>neon on.</b> say “glow off” to go plain.');
    },
    plain: function(){
      if (!state.neon && !state.rainbow){ say('<b>already plain.</b> nothing glowing here.'); return; }

      say('<b>plain.</b> glow off, colours off.');
    },
    rainbow: function(){
      killActions();

      say('<b>rainbow.</b> a colour cascade — reset to clear.');
    },

    reset: function(){
      killActions(); resetLetters(.45);
      clearLetterFx();
      gsap.set(wordEl, { x:0, rotation:0, scale:1, filter:'blur(0px)' });
      state.italic = false; state.scale = 1; state.speed = 1; state.colorIdx = -1;
      gsap.to(persist, { scale:1, skewX:0, duration:.6, ease:'power3.out' });
      gsap.to(document.body, { backgroundColor: theme().bg, duration:.8, ease:'power2.inOut' });
      gsap.to(glow, { background: glowGradient(theme().glow), duration:.8, ease:'power2.inOut' });
      applySpeed();
      say('<b>reset.</b> back to the default state.');
    }
  };

  /* ---------------- themes + type styles ---------------- */
  function applyTheme(name){
    if (!THEMES[name]) return;
    state.theme = name;
    state.colorIdx = -1;
    document.documentElement.setAttribute('data-theme', name);
    gsap.to(document.body, { backgroundColor: THEMES[name].bg, duration:.7, ease:'power2.inOut' });
    gsap.to(glow, { background: glowGradient(THEMES[name].glow), duration:.7, ease:'power2.inOut' });
    if (state.neon) paintNeon(false);
    Array.prototype.forEach.call(document.querySelectorAll('#themeSw .theme-row'), function(d){
      d.classList.toggle('active', d.getAttribute('data-theme') === name);
    });
    say('<b>theme — ' + THEMES[name].label.toLowerCase() + '.</b>');
  }
  function applyType(name){
    if (!TYPES[name]) return;
    state.type = name;
    document.documentElement.setAttribute('data-type', name);
    Array.prototype.forEach.call(document.querySelectorAll('#typeSw .type-row'), function(b){
      b.classList.toggle('active', b.getAttribute('data-type') === name);
    });
    say('<b>type — ' + TYPES[name].toLowerCase() + '.</b>');
  }
  document.getElementById('themeSw').addEventListener('click', function(e){
    var d = e.target.closest('.theme-row'); if (d) applyTheme(d.getAttribute('data-theme'));
  });
  document.getElementById('typeSw').addEventListener('click', function(e){
    var b = e.target.closest('.type-row'); if (b) applyType(b.getAttribute('data-type'));
  });

  /* ---------------- record / export ---------------- */
  var recBtn   = document.getElementById('recBtn');
  var recTime  = document.getElementById('recTime');
  var recLabel = recBtn.querySelector('.rec-label');
  var PHONE_GUIDANCE = '<b>Recording works in desktop Chrome</b> — on phone, use your screen ' +
    'recorder while you perform, or ask Jarvis to render the MP4.';
  var rec = { on:false, recorder:null, stream:null, chunks:[], mime:'', t0:0, timer:null };

  function captureSupported(){
    return !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia &&
              typeof MediaRecorder !== 'undefined');
  }
  function phoneLike(){
    var coarse = window.matchMedia('(pointer: coarse)').matches;
    var touch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
    return coarse || (touch && Math.min(window.innerWidth, window.innerHeight) < 820);
  }
  function fmtTime(ms){
    var s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }
  function setRecUI(on){
    rec.on = on;
    recBtn.classList.toggle('recording', on);
    recBtn.setAttribute('aria-pressed', String(on));
    recLabel.textContent = on ? 'Stop' : 'Record';
    recTime.hidden = !on;
    if (on) recTime.textContent = '0:00';
  }
  function startRecTimer(){
    rec.t0 = Date.now();
    rec.timer = setInterval(function(){ recTime.textContent = fmtTime(Date.now() - rec.t0); }, 250);
  }
  function stopRecTimer(){ if (rec.timer){ clearInterval(rec.timer); rec.timer = null; } }
  function stopStreamTracks(){
    if (rec.stream){ rec.stream.getTracks().forEach(function(t){ t.stop(); }); rec.stream = null; }
  }
  function finishRecording(){
    if (!rec.recorder) return;
    rec.recorder = null;
    stopRecTimer();
    var mime = rec.mime || 'video/webm';
    var blob = new Blob(rec.chunks, { type: mime });
    rec.chunks = [];
    stopStreamTracks();
    setRecUI(false);
    if (!blob.size){ say('<b>recording was empty.</b> try again.'); return; }
    var ext = mime.indexOf('mp4') !== -1 ? 'mp4' : 'webm';
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'motiq-recording.' + ext;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    say('<b>saved.</b> motiq-recording.' + ext + ' is in your downloads.');
  }
  function stopRecording(){
    if (rec.recorder && rec.recorder.state !== 'inactive'){ rec.recorder.stop(); }
    else { stopRecTimer(); stopStreamTracks(); setRecUI(false); }
  }
  async function startRecording(){
    var stream;
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({
        video: { width:{ ideal:1920 }, height:{ ideal:1080 }, frameRate:{ ideal:60 } },
        audio: false,
        preferCurrentTab: true
      });
    } catch (e) {
      say('<b>Recording needs tab-capture permission</b> — allow this tab when Chrome asks, then hit record again.');
      return;
    }
    rec.stream = stream;
    var candidates = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
    var mime = '';
    for (var i = 0; i < candidates.length; i++){
      if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(candidates[i])){ mime = candidates[i]; break; }
    }
    var recorder;
    try {
      recorder = mime ? new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12000000 })
                      : new MediaRecorder(stream);
    } catch (e) {
      stopStreamTracks();
      say('<b>recording is not supported</b> in this browser.');
      return;
    }
    rec.mime = recorder.mimeType || mime;
    rec.recorder = recorder;
    rec.chunks = [];
    recorder.ondataavailable = function(ev){ if (ev.data && ev.data.size) rec.chunks.push(ev.data); };
    recorder.onstop = finishRecording;
    stream.getVideoTracks().forEach(function(t){
      t.addEventListener('ended', function(){ stopRecording(); });
    });
    try { recorder.start(250); }
    catch (e) { rec.recorder = null; stopStreamTracks(); say('<b>recording failed to start.</b>'); return; }
    setRecUI(true);
    startRecTimer();
    say('<b>recording.</b> perform your moves — hit stop to save the clip.');
  }
  recBtn.addEventListener('click', function(){
    if (rec.on){ stopRecording(); return; }
    if (phoneLike() || !captureSupported()){ say(PHONE_GUIDANCE); return; }
    startRecording();
  });

  /* ---------------- parser ---------------- */
  var SUGGESTIONS = ['bounce','drop','glitch','scramble','neon','rainbow','flip','stretch',
                     'typewriter','melt','explode','spin','splash of color','swing','make it big'];
  var suggIdx = 0;

  function runCommand(raw){
    var t = ' ' + raw.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ') + ' ';
    var m;
    if ((m = raw.match(/^\s*(?:say|write|text|type)\s+(.+)$/i))){
      var w = m[1].replace(/[^a-zA-Z0-9 ]/g,'').trim().slice(0,14);
      if (w){ buildWord(w.toUpperCase()); say('<b>new words.</b> “' + w.toUpperCase() + '” — now move it.'); }
      return;
    }
    if (/( reset | normal | default | start over )/.test(t)) return actions.reset();
    if (/( glow off| neon off| no glow| plain )/.test(t)) return actions.plain();
    if (/ slow/.test(t)) return actions.slow();
    if (/( fast | speed| quicker| hurry)/.test(t)) return actions.fast();
    if (/( melt| drip| liquid)/.test(t)) return actions.melt();
    if (/( explode| shatter| burst| break| blast)/.test(t)) return actions.explode();
    if (/( bounce| jump| hop )/.test(t)) return actions.bounce();
    if (/( drop| fall| falling| fell )/.test(t)) return actions.drop();
    if (/( rise| arise| emerge)/.test(t)) return actions.rise();
    if (/ flip/.test(t)) return actions.flip();
    if (/( spin| rotate| twirl)/.test(t)) return actions.spin();
    if (/( glitch| static| distort| corrupt)/.test(t)) return actions.glitch();
    if (/( blur| foggy| unfocus| refocus| focus)/.test(t)) return actions.blur();
    if (/( stretch| rubber| elongate)/.test(t)) return actions.stretch();
    if (/( swing| pendulum| sway)/.test(t)) return actions.swing();
    if (/( scramble| shuffle| decode| random)/.test(t)) return actions.scramble();
    if (/( typewriter| typing| type it| type out)/.test(t)) return actions.typewriter();
    if (/( rainbow| colourful| colorful| pride)/.test(t)) return actions.rainbow();
    if (/( neon| glow)/.test(t)) return actions.neon();
    if (/( italic| slant| tilt| lean)/.test(t)) return actions.italics();
    if (/ upright| straighten/.test(t)) return actions.upright();
    if (/( big| bigger| grow| enlarge| huge| larger)/.test(t)) return actions.big();
    if (/( small| smaller| shrink| tiny)/.test(t)) return actions.small();
    if (/( zoom| punch| closer)/.test(t)) return actions.zoom();
    if (/( color| colour| splash| paint| flood)/.test(t)) return actions.color();
    if (/ wave| ripple/.test(t)) return actions.wave();
    if (/( shake| vibrate| tremble)/.test(t)) return actions.shake();
    unknownCommand();
  }

  function unknownCommand(){
    gsap.timeline()
      .to(form, { x:-9, duration:.05 }).to(form, { x:8, duration:.06 })
      .to(form, { x:-5, duration:.05 }).to(form, { x:0, duration:.06 });
    var s = SUGGESTIONS[suggIdx % SUGGESTIONS.length]; suggIdx++;
    say('hmm, don’t know that one — try <b>“' + s + '”</b>');
    input.placeholder = 'try “' + s + '”…';
  }

  /* ---------------- effects panel ---------------- */
  var FX_GROUPS = [
    { name:'Motion', items:[
      ['Bounce','bounce','overshoot hop'], ['Drop','drop','gravity fall'],
      ['Rise','rise','from below'], ['Explode','explode','shatter + return'],
      ['Spin','spin','full turn'], ['Flip','flip','3d cascade'],
      ['Wave','wave','sine cascade'], ['Swing','swing','pendulum'],
      ['Shake','shake','quick tremble'], ['Zoom punch','zoom','toward you']
    ]},
    { name:'Style', items:[
      ['Melt','melt','drip + reform'], ['Glitch','glitch','rgb split'],
      ['Blur','blur','out of focus'], ['Stretch','stretch','rubber band'],
      ['Typewriter','typewriter','letter by letter'], ['Scramble','scramble','decode in'],
      ['Italics','italics','slant −11°'], ['Go big','big','scale up'],
      ['Go small','small','scale down'], ['Slow down','slow down','ambient drift'],
      ['Speed up','speed up','ambient drift'], ['Neon','neon','glow pulse']
    ]},
    { name:'Colour', items:[
      ['Splash of color','splash of color','flood the stage'], ['Rainbow','rainbow','letter cascade'],
      ['Glow off','glow off','back to plain'], ['Reset','reset','default state']
    ]}
  ];
  var fxTotal = 0;
  FX_GROUPS.forEach(function(g){
    var wrap = document.createElement('div');
    wrap.className = 'fx-group';
    var h = document.createElement('h4'); h.textContent = g.name; wrap.appendChild(h);
    var grid = document.createElement('div'); grid.className = 'fx-grid';
    g.items.forEach(function(it){
      fxTotal++;
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'fx-tile';
      b.setAttribute('data-cmd', it[1]);
      var bold = document.createElement('b'); bold.textContent = it[0];
      var sub = document.createElement('span'); sub.textContent = it[2];
      b.appendChild(bold); b.appendChild(sub);
      b.addEventListener('click', function(){ runCommand(it[1]); closeDrawers(); input.focus(); });
      grid.appendChild(b);
    });
    wrap.appendChild(grid);
    fxPanel.appendChild(wrap);
  });
  document.getElementById('fxCount').textContent = fxTotal;

  /* ---------------- side panels: permanent on desktop, drawers on phone ---------------- */
  var mqPhone = window.matchMedia('(max-width: 820px)');
  function openDrawer(which){
    document.body.classList.toggle('drawer-l', which === 'left');
    document.body.classList.toggle('drawer-r', which === 'right');
  }
  function closeDrawers(){
    document.body.classList.remove('drawer-l', 'drawer-r');
  }
  function setPanel(open){
    if (mqPhone.matches){ if (open) openDrawer('left'); else closeDrawers(); }
    else document.body.classList.toggle('lp-closed', !open);
  }
  document.getElementById('drawerFx').addEventListener('click', function(){ openDrawer('left'); });
  document.getElementById('drawerStyle').addEventListener('click', function(){ openDrawer('right'); });
  document.getElementById('backdrop').addEventListener('click', closeDrawers);
  document.getElementById('lpCollapse').addEventListener('click', function(){
    if (mqPhone.matches) closeDrawers(); else document.body.classList.add('lp-closed');
  });
  document.getElementById('rpCollapse').addEventListener('click', function(){
    if (mqPhone.matches) closeDrawers(); else document.body.classList.add('rp-closed');
  });
  document.getElementById('lpTab').addEventListener('click', function(){ document.body.classList.remove('lp-closed'); });
  document.getElementById('rpTab').addEventListener('click', function(){ document.body.classList.remove('rp-closed'); });
  document.getElementById('stageColor').addEventListener('click', function(){ runCommand('splash of color'); });
  document.getElementById('stageReset').addEventListener('click', function(){ runCommand('reset'); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeDrawers();
  });

  /* ---------------- wiring ---------------- */
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var v = input.value.trim();
    if (!v) return;
    input.value = '';
    closeDrawers();
    runCommand(v);
    input.focus();
  });

  var CHIP_DEFS = [
    ['bounce','bounce'], ['melt','melt'], ['explode','explode'], ['spin','spin'],
    ['wave','wave'], ['italics','italics'], ['go big','big'], ['splash of color','splash of color'],
    ['slow down','slow down'], ['shake','shake'], ['reset','reset']
  ];
  var chipsEl = document.getElementById('chips');
  CHIP_DEFS.forEach(function(d){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = d[0];
    b.addEventListener('click', function(){ runCommand(d[1]); input.focus(); });
    chipsEl.appendChild(b);
  });

  /* click the word → edit it inline */
  wordEl.addEventListener('click', function(){
    wordIn.value = wordEl.textContent;
    wordEl.style.visibility = 'hidden';
    editHint.style.visibility = 'hidden';
    wordIn.style.display = 'block';
    wordIn.focus(); wordIn.select();
  });
  function commitWord(){
    var w = wordIn.value.replace(/[^a-zA-Z0-9 ]/g,'').trim().slice(0,14);
    wordIn.style.display = 'none';
    wordEl.style.visibility = 'visible';
    editHint.style.visibility = 'visible';
    if (w) { buildWord(w.toUpperCase()); say('<b>new words.</b> now give them a move.'); }
  }
  wordIn.addEventListener('blur', commitWord);
  wordIn.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); wordIn.blur(); } });

  /* ---------------- init ---------------- */
  buildWord('MOTION');
  startAmbient();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ /* metrics settle */ });
  window.__motiq = { run: runCommand, state: state, setTheme: applyTheme, setType: applyType,
                     setPanel: setPanel, openDrawer: openDrawer, closeDrawers: closeDrawers,
                     actions: actions,
                     isRecording: function(){ return rec.on; } };
})();
</script>
</body>
</html>
